[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-recommendation-engine"
version = "1.0.0"
description = "Matrix factorization and collaborative filtering recommendation engine for ecommerce product catalogs."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pytest>=7.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
